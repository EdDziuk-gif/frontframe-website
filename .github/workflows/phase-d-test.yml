name: Phase D validation

on:
  push:
    branches:
      - phase-d-scoring-wiring-2026-08-29
  workflow_dispatch:

jobs:
  test-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax check changed runtime files
        run: |
          node --check src/shared/scoring.js
          node --check src/routes/chat.js
          node --check src/shared/rate-limit.js
      - name: Run worker tests
        run: npm test -- --run
